name: Deploy BMI to Azure Test Slot

on:
  push:
    branches:
      - dev
    paths:
      - app.py
      - serve.py
      - web.config
      - requirements.txt
      - templates/**
      - static/**
      - tests/**
      - .github/workflows/deploy-azure-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-bmi-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest

    env:
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_SLOT_NAME: test
      PYTHON_RUNTIME_VERSION: 3.14.8

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. Run unit tests
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests

      # 5. SonarCloud / SonarQube Cloud scan
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECTKEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGKEY }}
            -Dsonar.sources=.
            -Dsonar.tests=tests
            -Dsonar.test.inclusions=tests/**
            -Dsonar.exclusions=.venv/**,__pycache__/**,tests/**,dist/**
            -Dsonar.python.version=3.14
            -Dsonar.sourceEncoding=UTF-8

      # 6. Package Windows Python application
      - name: Package Windows Python app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist\runtime | Out-Null

          Copy-Item app.py, serve.py, web.config dist\
          Copy-Item templates, static dist\ -Recurse

          python -m pip install `
            --target dist\site-packages `
            -r requirements.txt

          if ($LASTEXITCODE -ne 0) {
            throw 'Dependency packaging failed'
          }

          $archive = Join-Path $env:RUNNER_TEMP 'python-embed.zip'

          $url = "https://www.python.org/ftp/python/$env:PYTHON_RUNTIME_VERSION/python-$env:PYTHON_RUNTIME_VERSION-embed-amd64.zip"

          Write-Host "Downloading Python runtime from:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $archive

          $expectedHash = 'A93ABE456AB01BD96D7A085B3CDB6566B3063F4241360D114142FBDB07F0A310'

          $actualHash = (
            Get-FileHash `
              -Algorithm SHA256 `
              -LiteralPath $archive
          ).Hash

          if ($actualHash -ne $expectedHash) {
            throw 'Python runtime archive checksum mismatch'
          }

          Expand-Archive `
            -LiteralPath $archive `
            -DestinationPath dist\runtime

          Set-Content `
            -Path dist\runtime\python314._pth `
            -Value @(
              'python314.zip'
              '.'
              '..'
              '..\site-packages'
              'import site'
            )

          & .\dist\runtime\python.exe `
            -c 'import flask, waitress, app'

          if ($LASTEXITCODE -ne 0) {
            throw 'Packaged Python runtime could not import the app'
          }

      # 7. Login Azure
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 8. Verify Web App and create test slot when needed
      - name: Verify Windows Web App and create test slot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $platform = az webapp show `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --name $env:AZURE_WEBAPP_NAME `
            --query reserved `
            --output tsv

          if ($LASTEXITCODE -ne 0) {
            throw 'Azure Web App lookup failed'
          }

          if ($platform.Trim().ToLowerInvariant() -ne 'false') {
            throw 'Target must be a Windows Azure Web App'
          }

          az webapp deployment slot show `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --name $env:AZURE_WEBAPP_NAME `
            --slot $env:AZURE_SLOT_NAME `
            --output none

          if ($LASTEXITCODE -ne 0) {

            Write-Host "Azure Web App slot '$env:AZURE_SLOT_NAME' was not found."
            Write-Host "Creating test slot..."

            az webapp deployment slot create `
              --resource-group $env:AZURE_RESOURCE_GROUP `
              --name $env:AZURE_WEBAPP_NAME `
              --slot $env:AZURE_SLOT_NAME `
              --output none

            if ($LASTEXITCODE -ne 0) {
              throw "Azure Web App slot '$env:AZURE_SLOT_NAME' could not be created"
            }
          }

      # 9. Deploy to test slot
      - name: Deploy to Azure Web App test slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_SLOT_NAME }}
          package: dist